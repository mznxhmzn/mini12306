<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini-12306 车票改签">
  <title>车票改签 - Mini-12306</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <div class="app-shell business-shell">
    <header class="subpage-header">
      <a class="header-action" href="orders.html" aria-label="返回我的订单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1>车票改签</h1>
      <span></span>
    </header>

    <main class="subpage-content">
      <!-- 原车票 -->
      <section class="section-card" aria-labelledby="original-ticket-title">
        <div class="section-heading"><h2 id="original-ticket-title">原车票</h2><span class="status-label status-paid">有效</span></div>
        <div class="price-list">
          <div class="price-row"><span>09月12日　G66</span><strong>武汉 → 北京南</strong></div>
          <div class="price-row"><span>07:38 — 11:30</span><strong>二等座</strong></div>
          <div class="price-row"><span>乘车人</span><strong data-current-user-name>旅客用户</strong></div>
        </div>
      </section>

      <!-- 新行程条件 -->
      <section class="section-card form-stack" aria-labelledby="new-journey-title">
        <h2 id="new-journey-title">选择新行程</h2>
        <div class="form-group"><label class="form-label" for="new-date">新出发日期</label><input id="new-date" class="form-control" type="date" value="2026-09-13"></div>
        <p class="muted-text">可选择新的城市、车次、日期及席别，差额以服务器核算为准。</p>
      </section>

      <!-- 可改签车次 -->
      <section class="section-card" aria-labelledby="available-train-title">
        <div class="section-heading"><h2 id="available-train-title">可选车次</h2><a href="#refresh">刷新</a></div>
        <label class="reschedule-option">
          <input type="radio" name="newTrain" checked>
          <span class="reschedule-train"><strong>G66　07:38 → 11:30</strong><span>二等座 · 余票充足 · 3小时52分</span></span>
          <span class="reschedule-price">¥520.50</span>
        </label>
        <label class="reschedule-option">
          <input type="radio" name="newTrain">
          <span class="reschedule-train"><strong>Z38　21:10 → 06:40</strong><span>硬卧 · 余票紧张 · 9小时30分</span></span>
          <span class="reschedule-price">¥261.50</span>
        </label>
      </section>

      <!-- 改签差价 -->
      <section class="section-card" aria-labelledby="difference-title">
        <div class="section-heading"><h2 id="difference-title">改签金额</h2></div>
        <div class="price-list">
          <div class="price-row"><span>原票价</span><strong>¥520.50</strong></div>
          <div class="price-row"><span>新票价</span><strong>¥520.50</strong></div>
        </div>
        <div class="refund-result"><span>本次无需补款或退款</span><strong>¥0.00</strong></div>
      </section>

      <div class="notice-box"><span class="notice-mark">!</span><span>新票确认成功后原票才会关闭；若处理失败，原票仍保持有效。</span></div>
      <button class="primary-button page-submit" type="button">确认改签</button>
    </main>

    <!-- 公共底部导航：订单高亮 -->
    <nav class="tab-bar" aria-label="主要导航">
      <a class="tab-item" href="../index.html"><span class="nav-text-icon" aria-hidden="true">首</span><span>首页</span></a>
      <a class="tab-item is-active" href="orders.html" aria-current="page"><span class="nav-text-icon" aria-hidden="true">单</span><span>订单</span></a>
      <a class="tab-item" href="profile.html"><span class="nav-text-icon" aria-hidden="true">我</span><span>我的</span></a>
    </nav>
  </div>

  <!-- 初始化数据并检查登录状态 -->
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/role-guard.js"></script>
  <script src="../js/booking.js"></script>
</body>
</html>
