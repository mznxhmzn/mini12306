<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="确认 Mini-12306 购票订单">
  <title>确认订单 - Mini-12306</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <div class="app-shell business-shell">
    <!-- 页面标题 -->
    <header class="subpage-header">
      <a class="header-action" href="train-list.html" aria-label="返回车次列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1>确认订单</h1>
      <span></span>
    </header>

    <main class="subpage-content">
      <!-- 所选车次 -->
      <section class="section-card journey-card" aria-labelledby="confirm-train-title">
        <div class="journey-card-top">
          <strong id="confirm-train-title">G66 高速动车</strong>
          <span>09月12日 周六</span>
        </div>
        <div class="journey-route">
          <div class="journey-station"><strong class="journey-time">07:38</strong><p>武汉站</p></div>
          <div class="journey-direction"><span class="journey-line"></span><small>3小时52分</small></div>
          <div class="journey-station"><strong class="journey-time">11:30</strong><p>北京南站</p></div>
        </div>
        <div class="journey-detail"><span>二等座</span><span>有票</span><strong>¥520.50</strong></div>
      </section>

      <!-- 乘车人选择 -->
      <section class="section-card" aria-labelledby="passenger-title">
        <div class="section-heading">
          <h2 id="passenger-title">选择乘车人</h2>
          <a href="#add-passenger">＋ 添加</a>
        </div>
        <label class="choice-row">
          <span class="choice-main">
            <span class="choice-avatar">张</span>
            <span class="choice-copy"><strong data-current-user-name>旅客用户</strong><span>身份证信息已脱敏</span></span>
          </span>
          <input class="choice-check" type="checkbox" checked aria-label="选择张小明">
        </label>
      </section>

      <!-- 席别与联系人 -->
      <section class="section-card form-stack" aria-labelledby="ticket-setting-title">
        <h2 id="ticket-setting-title">车票信息</h2>
        <div class="form-group">
          <label class="form-label" for="seat-type">席别</label>
          <select id="seat-type" class="select-control">
            <option>二等座　¥520.50　余票充足</option>
            <option>一等座　¥832.50　余票紧张</option>
            <option>商务座　¥1643.50　余票紧张</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-phone">通知手机号</label>
          <input id="contact-phone" class="form-control" type="tel" value="13800008001" inputmode="numeric">
        </div>
      </section>

      <!-- 费用明细 -->
      <section class="section-card" aria-labelledby="price-title">
        <div class="section-heading"><h2 id="price-title">费用明细</h2></div>
        <div class="price-list">
          <div class="price-row"><span>成人票 × 1</span><strong>¥520.50</strong></div>
          <div class="price-row"><span>服务费</span><strong>¥0.00</strong></div>
          <div class="price-row price-total"><span>应付金额</span><strong>¥520.50</strong></div>
        </div>
      </section>

      <label class="agreement-row">
        <input type="checkbox" checked>
        <span>我已核对乘车日期、车次、乘车人及席别信息</span>
      </label>

      <a class="primary-button page-submit" href="payment.html">提交订单</a>
    </main>

    <!-- 公共底部导航：首页流程高亮首页 -->
    <nav class="tab-bar" aria-label="主要导航">
      <a class="tab-item is-active" href="../index.html" aria-current="page"><span class="nav-text-icon" aria-hidden="true">首</span><span>首页</span></a>
      <a class="tab-item" href="orders.html"><span class="nav-text-icon" aria-hidden="true">单</span><span>订单</span></a>
      <a class="tab-item" href="profile.html"><span class="nav-text-icon" aria-hidden="true">我</span><span>我的</span></a>
    </nav>
  </div>

  <!-- 初始化数据并检查登录状态 -->
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/role-guard.js"></script>
  <script src="../js/booking.js"></script>
</body>
</html>
