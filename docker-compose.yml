services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      # 首次启动初始化单节点副本集，后续只检查 PRIMARY 状态。
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (!rs.status().ok) quit(1); } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);'"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: server/Dockerfile}
    env_file: server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/mini12306?replicaSet=rs0
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mongo-data:
