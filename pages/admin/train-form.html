<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>车次编辑 - Mini-12306</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../css/pages.css"><link rel="stylesheet" href="../../css/admin.css"></head>
<body data-role="admin"><div class="app-shell business-shell admin-shell">
<!-- 角色专属界面沿用蓝色标题与圆角卡片 -->
<header class="subpage-header"><a href="dashboard.html" class="header-action">‹</a><h1>车次编辑</h1><button type="button" class="header-action" data-action="logout">退出</button></header>
<main class="subpage-content"><form id="train-form" class="section-card form-stack"><p id="core-warning" class="notice-box" hidden>已有订单：核心字段不可修改。</p><div class="form-group"><label for="trainNumber" class="form-label">车次号</label><input id="trainNumber" class="form-control" type="text" value="" required></div><div class="form-group"><label for="trainType" class="form-label">列车类型</label><input id="trainType" class="form-control" type="text" value="高速动车" required></div><div class="form-group"><label for="departureStation" class="form-label">出发站</label><input id="departureStation" class="form-control" type="text" value="" required></div><div class="form-group"><label for="arrivalStation" class="form-label">到达站</label><input id="arrivalStation" class="form-control" type="text" value="" required></div><div class="form-group"><label for="departureCity" class="form-label">出发城市</label><input id="departureCity" class="form-control" type="text" value="" required></div><div class="form-group"><label for="arrivalCity" class="form-label">到达城市</label><input id="arrivalCity" class="form-control" type="text" value="" required></div><div class="form-group"><label for="departureTime" class="form-label">出发时间</label><input id="departureTime" class="form-control" type="time" value="08:00" required></div><div class="form-group"><label for="arrivalTime" class="form-label">到达时间</label><input id="arrivalTime" class="form-control" type="time" value="12:00" required></div><div class="form-group"><label for="durationMinutes" class="form-label">历时（分钟）</label><input id="durationMinutes" class="form-control" type="number" value="240" required></div><h2>席别：名称 / 票价 / 余票</h2><div id="seat-rows"></div><button id="add-seat" type="button" class="secondary-button">添加席别</button><h2>运营日期</h2><input id="operating-date" class="form-control" type="date"><button id="add-date" class="secondary-button" type="button">添加日期</button><div id="date-tags" class="date-tags"></div><label class="checkbox-row"><input id="bookable" type="checkbox" checked>允许售票</label><label for="stops">经停站（逗号分隔）</label><input id="stops" class="form-control" type="text"><p class="muted-text">修改席别会将填写的余票数设置为每个运营日的可售余票，已有订单保持有效。</p><button type="submit" class="primary-button">保存车次</button></form></main><nav class="tab-bar" aria-label="角色导航"></nav></div>
<script src="../../js/storage.js"></script><script src="../../js/utils.js"></script><script src="../../js/api.js"></script><script src="../../js/role-guard.js"></script><script src="../../js/management.js"></script>
</body></html>
