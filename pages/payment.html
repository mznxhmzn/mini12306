<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini-12306 模拟支付页面">
  <title>订单支付 - Mini-12306</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <div class="app-shell business-shell">
    <!-- 支付页面标题 -->
    <header class="subpage-header">
      <a class="header-action" href="order-confirm.html" aria-label="返回确认订单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1>订单支付</h1>
      <button class="header-action" type="button">帮助</button>
    </header>

    <!-- 待支付金额 -->
    <section class="payment-hero" aria-label="支付金额">
      <p>应付金额</p>
      <strong class="payment-amount">¥520.50</strong>
      <span class="payment-countdown">剩余支付时间 14:36</span>
    </section>

    <main class="subpage-content">
      <!-- 订单摘要 -->
      <section class="section-card" aria-labelledby="payment-order-title">
        <div class="section-heading"><h2 id="payment-order-title">订单信息</h2><span class="status-label status-pending">待支付</span></div>
        <div class="price-list">
          <div class="price-row"><span>武汉 → 北京南</span><strong>G66</strong></div>
          <div class="price-row"><span>乘车日期</span><strong>09月12日 07:38</strong></div>
          <div class="price-row"><span>乘车人</span><strong data-current-user-name>旅客用户</strong></div>
          <div class="price-row"><span>席别</span><strong>二等座</strong></div>
        </div>
      </section>

      <!-- 模拟支付方式 -->
      <section class="section-card" aria-labelledby="payment-method-title">
        <div class="section-heading"><h2 id="payment-method-title">选择支付方式</h2></div>
        <label class="payment-method">
          <span class="payment-method-icon alipay">支</span>
          <span class="payment-method-copy"><strong>支付宝</strong><span>推荐使用</span></span>
          <input type="radio" name="paymentMethod" checked>
        </label>
        <label class="payment-method">
          <span class="payment-method-icon wechat">微</span>
          <span class="payment-method-copy"><strong>微信支付</strong><span>安全便捷</span></span>
          <input type="radio" name="paymentMethod">
        </label>
        <label class="payment-method">
          <span class="payment-method-icon bank">卡</span>
          <span class="payment-method-copy"><strong>演示银行卡</strong><span>尾号 8888</span></span>
          <input type="radio" name="paymentMethod">
        </label>
      </section>

      <div class="notice-box"><span class="notice-mark">!</span><span>当前为演示支付页面，不会产生真实扣款。请勿输入真实银行卡或支付信息。</span></div>

      <a class="primary-button page-submit" href="orders.html">确认模拟支付 ¥520.50</a>
    </main>

    <!-- 公共底部导航 -->
    <nav class="tab-bar" aria-label="主要导航">
      <a class="tab-item is-active" href="../index.html" aria-current="page"><span class="nav-text-icon" aria-hidden="true">首</span><span>首页</span></a>
      <a class="tab-item" href="orders.html"><span class="nav-text-icon" aria-hidden="true">单</span><span>订单</span></a>
      <a class="tab-item" href="profile.html"><span class="nav-text-icon" aria-hidden="true">我</span><span>我的</span></a>
    </nav>
  </div>

  <!-- 初始化数据并检查登录状态 -->
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/role-guard.js"></script>
  <script src="../js/booking.js"></script>
</body>
</html>
