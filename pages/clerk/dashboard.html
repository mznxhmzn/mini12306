<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>售票工作台 - Mini-12306</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../css/pages.css"><link rel="stylesheet" href="../../css/admin.css"></head>
<body data-role="clerk"><div class="app-shell business-shell admin-shell">
<!-- 角色专属界面沿用蓝色标题与圆角卡片 -->
<header class="subpage-header"><a href="dashboard.html" class="header-action">‹</a><h1>售票工作台</h1><button type="button" class="header-action" data-action="logout">退出</button></header>
<main class="subpage-content"><section class="section-card"><h2>售票员工作台</h2><p data-current-user-name></p><p class="muted-text">为旅客办理柜台模拟出票，不产生真实扣款。</p></section><form id="clerk-search" class="section-card form-stack"><label for="from">出发城市</label><input id="from" type="text" value="武汉" class="form-control" required><label for="to">目的地</label><input id="to" type="text" value="北京" class="form-control" required><label for="date">出发日期</label><input id="date" type="date" value="" class="form-control" required><button type="submit" class="primary-button">查询车次</button></form><form id="issue-form" class="section-card form-stack"><h2>模拟出票</h2><label for="userId">旅客用户编号（示例 USER-001）</label><input id="userId" class="form-control" required><label for="issue-choice">车次及席别</label><select id="issue-choice" class="select-control" required></select><button type="submit" class="primary-button">确认模拟出票</button><p id="issue-result" class="admin-message" role="status"></p></form></main><nav class="tab-bar" aria-label="角色导航"></nav></div>
<script src="../../js/storage.js"></script><script src="../../js/utils.js"></script><script src="../../js/api.js"></script><script src="../../js/role-guard.js"></script><script src="../../js/management.js"></script>
</body></html>
