<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini-12306 车票查询首页">
  <title>首页 - Mini-12306</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 应用主体：移动端优先，电脑端居中展示 -->
  <div class="app-shell">
    <!-- 顶部品牌区域 -->
    <header class="page-header">
      <div class="brand-row">
        <div>
          <p class="brand-caption">MINI-12306</p>
          <h1>铁路出行</h1>
        </div>
        <div class="header-badge" aria-label="安全出行">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 5 6v5c0 4.6 2.9 8.5 7 10 4.1-1.5 7-5.4 7-10V6l-7-3Z"></path>
            <path d="m9.2 12 1.8 1.8 3.9-4"></path>
          </svg>
        </div>
      </div>
      <p class="header-message">美好旅程，从这里出发</p>
    </header>

    <!-- 首页主要内容 -->
    <main class="page-content">
      <section class="search-card" aria-labelledby="ticket-search-title">
        <h2 id="ticket-search-title">车票查询</h2>

        <form id="ticket-search-form" class="ticket-form" data-result-url="pages/train-list.html" novalidate>
          <!-- 出发地和目的地 -->
          <div class="route-selector">
            <button id="departure-city" class="city-button" type="button" aria-label="选择出发地" data-city="武汉">
              <span class="field-label">出发地</span>
              <span class="city-name">武汉</span>
              <span class="city-hint">请选择城市</span>
            </button>

            <button id="swap-cities" class="swap-button" type="button" aria-label="交换出发地和目的地" title="交换出发地和目的地">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"></path>
              </svg>
            </button>

            <button id="arrival-city" class="city-button city-button-right" type="button" aria-label="选择目的地" data-city="北京">
              <span class="field-label">目的地</span>
              <span class="city-name">北京</span>
              <span class="city-hint">请选择城市</span>
            </button>
          </div>

          <!-- 出发日期 -->
          <label class="date-field" for="departure-date">
            <span class="date-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"></path>
              </svg>
            </span>
            <span class="date-copy">
              <span class="field-label">出发日期</span>
              <input id="departure-date" name="departureDate" type="date" aria-label="选择出发日期">
            </span>
          </label>

          <!-- 学生票开关 -->
          <div class="student-row">
            <div>
              <p class="student-title">学生票</p>
              <p class="student-description">仅查询符合学生优惠条件的车票</p>
            </div>
            <label class="toggle">
              <input id="student-ticket" type="checkbox" name="studentTicket" aria-label="开启学生票查询">
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>

          <button class="primary-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.5 16.5 4 4"></path>
            </svg>
            查询车票
          </button>
        </form>
      </section>

      <!-- 温馨提示 -->
      <section class="travel-tip" aria-label="购票提示">
        <span class="tip-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"></path>
            <path d="M12 10v6m0-10h.01"></path>
          </svg>
        </span>
        <div>
          <h2>温馨提示</h2>
          <p>当前为功能演示版本，车次及票价均为模拟数据。</p>
        </div>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="tab-bar" aria-label="主要导航">
      <a class="tab-item is-active" href="index.html" aria-current="page">
        <span class="nav-text-icon" aria-hidden="true">首</span>
        <span>首页</span>
      </a>
      <a class="tab-item" href="pages/orders.html">
        <span class="nav-text-icon" aria-hidden="true">单</span>
        <span>订单</span>
      </a>
      <a class="tab-item" href="pages/profile.html">
        <span class="nav-text-icon" aria-hidden="true">我</span>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <!-- 初始化数据后检查登录状态，并持续监控 30 分钟无操作超时 -->
  <script src="js/utils.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
