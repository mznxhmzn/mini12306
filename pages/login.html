<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="登录 Mini-12306 演示系统">
  <title>登录 - Mini-12306</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="login-page">
  <!-- 登录页面主体 -->
  <main class="login-shell">
    <!-- 品牌区 -->
    <header class="login-brand">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M12 9h24a5 5 0 0 1 5 5v17a5 5 0 0 1-5 5H12a5 5 0 0 1-5-5V14a5 5 0 0 1 5-5Z"></path>
          <path d="M12 28h24M15 36l-4 5m22-5 4 5M16 17h16"></path>
          <circle cx="15" cy="31" r="1.5"></circle>
          <circle cx="33" cy="31" r="1.5"></circle>
        </svg>
      </div>
      <p class="brand-caption login-brand-caption">MINI-12306</p>
      <h1>欢迎登录</h1>
      <p>登录后查询车次并管理您的出行订单</p>
    </header>

    <!-- 登录表单 -->
    <form id="login-form" class="login-form" novalidate>
      <label class="login-field" for="phone">
        <span class="login-field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="2" width="12" height="20" rx="2"></rect>
            <path d="M10 5h4m-3 14h2"></path>
          </svg>
        </span>
        <span class="visually-hidden">手机号</span>
        <input
          id="phone"
          name="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          pattern="1[0-9]{10}"
          maxlength="11"
          placeholder="请输入手机号"
          required
        >
      </label>

      <label class="login-field" for="password">
        <span class="login-field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"></path>
          </svg>
        </span>
        <span class="visually-hidden">密码</span>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          placeholder="请输入密码"
          required
        >
        <button id="password-toggle" class="password-toggle" type="button" aria-label="显示密码">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
          </svg>
        </button>
      </label>

      <div class="login-assist">
        <a href="forgot-password.html">忘记密码？</a>
      </div>

      <button id="login-button" class="primary-button login-button" type="submit">登录</button>

      <p class="register-entry">还没有账号？<a href="register.html">注册账号</a></p>
    </form>

    <!-- 第三方登录仅作界面展示 -->
    <section class="third-party-login" aria-label="其他登录方式">
      <div class="section-divider"><span>其他登录方式</span></div>
      <div class="third-party-list">
        <button class="social-button wechat" type="button" aria-label="微信登录，暂未开放"><span>微</span></button>
        <button class="social-button qq" type="button" aria-label="QQ登录，暂未开放"><span>Q</span></button>
      </div>
    </section>

    <p class="login-agreement">登录即表示同意《服务协议》和《隐私政策》</p>
  </main>

  <!-- 公共脚本必须先于登录页面脚本加载 -->
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/role-guard.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
